# The dreaming worker at sample scale (design sections 5 and 6).
#
# Nightly: re-dream the epistemic layer and append a hygiene measurement, so
# the hygiene score is a time series from day one rather than a number someone
# remembers to take. Beliefs can change without any new assertion, because
# dream.py reads source reliability priors and method config from
# ontology/ontology.json; editing a prior is a belief change the next run picks
# up. `git diff graph/projections.jsonl` is then "what this mind changed its
# mind about last night".
#
# hygiene.py appends one row per day. A quiet mind therefore does accumulate a
# row a night with identical numbers, and that is the intent: the series is a
# daily record, and a flat stretch is itself a finding. Re-running the script
# twice in one day appends nothing.
#
# Keeping the template blank. The obvious guard,
# `if: ${{ !github.event.repository.is_template }}`, is a trap on this
# workflow: a schedule event carries an EMPTY webhook payload, so
# `github.event.repository` is undefined, the negation is true, and the cron
# fires on the template repository itself. The guard below is content-based
# instead of payload-based: a mind with an empty Edda log has nothing to dream
# about, which is exactly what the template is and what a freshly stamped mind
# is until its first assertion. It needs no repository name, so it survives the
# eventual transfer into the org, and it costs one checkout.
name: dream

on:
  schedule:
    # 03:17 UTC. Off the hour on purpose: the top of the hour is the most
    # contended slot on shared runners and the most commonly dropped.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Is there a mind here to dream about
        id: guard
        run: |
          set -euo pipefail
          # The Edda header (line 1) is not an assertion. A log with only a
          # header, or no log at all, is a blank mind.
          if [ -s graph/assertions.jsonl ] && [ "$(grep -c '' graph/assertions.jsonl)" -gt 1 ]; then
            echo "blank=false" >> "$GITHUB_OUTPUT"
          else
            echo "blank=true" >> "$GITHUB_OUTPUT"
            echo "empty Edda log: this is a blank mind (the template, or a mind before its first assertion); nothing to dream about"
          fi

      - uses: actions/setup-python@v7
        if: steps.guard.outputs.blank != 'true'
        with:
          python-version: "3.13"

      - name: Fold the log
        if: steps.guard.outputs.blank != 'true'
        run: python3 scripts/project.py

      - name: Dream (evidence_weighted/v0)
        if: steps.guard.outputs.blank != 'true'
        run: python3 scripts/dream.py

      - name: Measure hygiene
        if: steps.guard.outputs.blank != 'true'
        run: python3 scripts/hygiene.py

      - name: Invariant sweep
        if: steps.guard.outputs.blank != 'true'
        run: python3 scripts/check.py

      - name: Commit the night's work
        if: steps.guard.outputs.blank != 'true'
        run: |
          set -euo pipefail
          git config user.name "skaldos-mind[bot]"
          git config user.email "skaldos-mind[bot]@users.noreply.github.com"
          git add -A graph vault
          if git diff --cached --quiet; then
            echo "nothing changed overnight"
            exit 0
          fi
          git commit -m "mind: nightly dream and hygiene measurement [skip ci]" \
            -m "Automated run of .github/workflows/dream.yml."
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the remote"
            git pull --rebase --autostash
          done
          echo "could not push the night's work after 3 attempts" >&2
          exit 1
